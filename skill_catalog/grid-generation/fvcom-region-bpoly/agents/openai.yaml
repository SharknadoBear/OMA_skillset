name: fvcom-region-bpoly
description: Create feature-first FVCOM RegionBPoly mission envelopes and apply land-side post-arc clipping feedback while preserving mission scope.
instructions: |
  Use scripts/run_region_bpoly.py by default. Use --mode execute unless the user
  explicitly requests retained test/debug/benchmark artifacts. Execute mode
  outputs region_bpoly.json, region_bpoly_final_map.png, and
  offshore_boundary_artifacts.json, then removes intermediate artifacts after a
  pass. Test mode keeps intermediate/visual_review with initial guess maps,
  target-region feature JSON, feature GeoJSON, candidate maps, side zoom maps,
  coverage JSON, and score evidence.

  Heuristic mode is explicit. --heuristic-mode auto resolves to memory for
  execute mode and unknown for test mode. In test/unknown mode, do not use
  hard-coded known-region place guesses, feature-library inference, deformation
  presets, deterministic repair candidates, or a Delaware/NJ fallback. If the
  prompt lacks explicit target_region_features, required feature ingredients, or
  an explicit polygon seed, write needs_review with
  unknown_region_no_feature_plan. Explicit feature boxes are still valid in test
  mode and may be used to build the bpoly.

  Treat polygon_lonlat as the mission and land-boundary-completeness geometry,
  not as a containment cage for a downstream coastal OBC. Treat envelope_bbox
  only as an initial source-coverage/plot helper; downstream bathymetry follows
  the assembled wet-domain polygon. The offshore point only identifies the
  intended offshore side for downstream coastline-anchor snapping; boundary arc
  generation is outside this skill.

  Every initial, candidate, zoom, adjustment, and final map must include
  background map context. Default --basemap-provider is auto: use road_detail
  for small-estuary and creek-scale cases, topographic context for
  regional/lake/island-chain cases, then local coastline/minimal fallback if
  online tiles are unavailable. road_detail tries Esri World Street Map, CARTO
  Voyager, then OpenStreetMap Mapnik with explicit small-estuary zoom policy.
  none/off basemap requests mean offline fallback, never blank lat/lon-only
  plots.

  Preserve mission scope: tidal-energy/all-channel/connectivity prompts require
  connected straits, island chains, river gates, lake connecting channels, and
  forcing aprons unless explicitly scoped out. Use normalized place-name and
  longitude-frame logic for Southeast Alaska, Hawaii/Hawaii Island, and
  antimeridian regions so bad initial boxes do not contaminate corrected fits.

  Apply v3 QA guards before pass: Cook Inlet wave/wave-current/SWAN/fetch
  prompts use cook_inlet_wave_fetch and must include Kodiak, Augustine Island,
  Ursus Cove/Kamishak, and a broad Gulf wave apron while avoiding unnecessary
  Prince William Sound overreach. Cook tidal-only/current-only prompts use
  cook_inlet_tidal_mouth and keep Kodiak as an obstruction guard. Mobile Bay
  domains must keep the Gulf gate west enough to land beyond Horn Island while
  avoiding unnecessary Perdido Bay / Wolf Bay inclusion.
  Hawaii Island / Big-Island-only domains must avoid Maui Nui / neighboring-
  island obstruction guards; Hawaii State/island chain requests may include the
  chain. Murderkill-style prompts are small-estuary scale and must satisfy
  tighter area/width limits with road_detail map policy. If deterministic repair
  candidates cannot both cover required features and avoid obstruction/tightness
  failures, mark final_status=needs_review instead of a false pass.

  Use scripts/adjust_region_bpoly.py for final-stage rotate, scale, or reshape
  edits from map review. The adjustment map must show the old polygon dashed and
  the adjusted polygon solid.

  Use scripts/apply_arc_feedback.py only for land-boundary truncation with a hash-matched
  current region_bpoly_arc_feedback_v2 artifact (or historical v1 evidence). Preserve target_region_features exactly,
  rerun feature/guard/offshore QA, and reject stale or semantic-changing feedback.
